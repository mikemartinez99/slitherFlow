[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slitherflow"
version = "1.1.0"
description = "slitherFlow: subway maps for Snakemake pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pyyaml>=5"]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Documentation = "https://mikemartinez99.github.io/slitherFlow/"
Source = "https://github.com/mikemartinez99/slitherFlow"

[project.scripts]
slitherflow = "slitherflow.cli:main"

[tool.setuptools]
packages = ["slitherflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
slitherflow = { path = "." }

[tool.pixi.package]
name = { workspace = true }

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "0.*"

[tool.pixi.package.build.config]
ignore-pypi-mapping = false

[tool.pixi.package.host-dependencies]
setuptools = ">=77"

[tool.pixi.package.run-dependencies]
librsvg = "*"
snakemake-minimal = "*"

[tool.pixi.feature.test.dependencies]
pytest = ">=7"

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
test-py39 = ["test", "py39"]
test-py314 = ["test", "py314"]

[tool.pixi.tasks.slitherflow]
cmd = 'cd "$INIT_CWD" && slitherflow'
description = "Run the slitherflow CLI from the folder you called pixi in"

[tool.pixi.feature.test.tasks]
test = "pytest"
